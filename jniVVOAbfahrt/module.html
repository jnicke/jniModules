<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/icons.js"></script>
<style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
        font-family: inherit;
        color: var(--content-color);
        font-size: var(--font-size, 14px);
        padding: var(--margin-top, 10px) var(--margin-side, 12px) var(--margin-bottom, 10px);
        display: flex;
        flex-direction: column;
        gap: 0.5em;
        -webkit-font-smoothing: antialiased;
    }
    .linie-trenner { border-top: 1px solid color-mix(in srgb, var(--content-color) 12%, transparent); }

    /* ---------- Kopf ---------- */
    .kopf { display: flex; align-items: center; gap: 0.6em; flex: 0 0 auto; }
    .kopf .symbol { font-size: 1.9em; color: var(--accent-color); width: 1.2em; text-align: center; }
    .kopf .titel { flex: 1 1 auto; min-width: 0; }
    .kopf .name { font-weight: 600; font-size: 1.1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kopf .ort { font-size: 0.82em; opacity: 0.62; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kopf .fuss { font-size: 0.95em; opacity: 0.8; white-space: nowrap; }
    .kopf .fuss i { margin-right: 0.25em; }

    /* ---------- Abfahrten ---------- */
    .liste { list-style: none; margin: 0; padding: 0; flex: 1 1 auto; min-height: 0; overflow: hidden; }
    .zeile {
        display: grid;
        grid-template-columns: 3.4em 1fr auto 3.8em;
        align-items: center;
        gap: 0 0.6em;
        padding: 0.42em 0;
        border-top: 1px solid color-mix(in srgb, var(--content-color) 12%, transparent);
        transition: opacity 0.4s;
    }
    .zeile:first-child { border-top: none; }
    .zeile.weg { opacity: 0.38; }
    .badge {
        display: inline-flex; align-items: center; justify-content: center; gap: 0.25em;
        min-width: 2.9em; padding: 0.22em 0.45em; border-radius: 0.35em;
        font-weight: 700; color: #fff; font-size: 0.95em; white-space: nowrap;
    }
    .badge i { font-size: 0.9em; opacity: 0.95; }
    .m-Tram { background: #c8102e; }
    .m-CityBus { background: #005ca9; }
    .m-IntercityBus { background: #4f7a28; }
    .m-SuburbanRailway { background: #00873e; }
    .m-Train { background: #5a5a5a; }
    .m-Ferry { background: #0098d4; }
    .m-Cableway { background: #8a5a9e; }
    .m-HailedSharedTaxi { background: #d98200; }
    .ziel { min-width: 0; }
    .ziel .text { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ziel .info { font-size: 0.85em; opacity: 0.65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ausfall .ziel .text { text-decoration: line-through; opacity: 0.6; }
    .ausfall .ziel .info { color: #e5484d; opacity: 1; font-weight: 600; }
    .chips { display: flex; align-items: center; gap: 0.5em; font-size: 0.95em; white-space: nowrap; }
    .spaet { color: #e5484d; font-weight: 600; }
    .frueh { color: #2f9e44; font-weight: 600; }
    .voll { color: #e5484d; }
    .min { text-align: right; font-size: 1.35em; font-weight: 300; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .min small { font-size: 0.55em; margin-left: 0.1em; opacity: 0.7; }
    .min.uhr { font-size: 1.05em; }
    .los .min { color: var(--accent-color); font-weight: 600; }
    .ausfall .min { text-decoration: line-through; opacity: 0.5; }

    .leer { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5em; opacity: 0.65; text-align: center; }
    .leer i { font-size: 2em; }

    /* ---------- Inhalt: Liste + Karte ---------- */
    .inhalt { flex: 1 1 auto; min-height: 0; display: flex; gap: 1em; }
    .inhalt .liste { flex: 1 1 auto; min-width: 0; }
    .karte { position: relative; flex: 0 0 40%; min-width: 0; min-height: 8em; overflow: hidden; border-radius: 0.6em;
             background: color-mix(in srgb, var(--content-color) 6%, transparent); }
    @media (max-width: 560px) { .inhalt { flex-direction: column; } .karte { flex: 0 0 42%; } }
    .kacheln, .marker { position: absolute; inset: 0; }
    .kacheln img { position: absolute; width: 256px; height: 256px; max-width: none; user-select: none; pointer-events: none; }
    .karte.dunkel .kacheln { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.85) saturate(0.5); }
    .karte.hell .kacheln { filter: saturate(0.6); }
    .steig { position: absolute; transform: translate(-50%, -50%); width: 2em; height: 2em; border-radius: 50%;
             display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 1em;
             border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.55); z-index: 2; }
    .steig small { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 0.2em;
                   font-size: 0.62em; font-weight: 600; white-space: nowrap; color: var(--content-color);
                   text-shadow: 0 0 3px var(--card-color, #000), 0 0 3px var(--card-color, #000), 0 0 4px var(--card-color, #000); }
    .steig.blink { z-index: 4; animation: puls 1.2s ease-in-out infinite; }
    .steig.blink.eilig { animation-duration: 0.6s; }
    @keyframes puls {
        0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 var(--accent-color); }
        50% { transform: translate(-50%, -50%) scale(1.35); background: var(--accent-color);
              box-shadow: 0 0 0 0.5em color-mix(in srgb, var(--accent-color) 35%, transparent); }
    }
    .haus { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center;
            font-size: 0.85em; font-weight: 700; color: var(--content-color); z-index: 3;
            text-shadow: 0 0 3px var(--card-color, #000), 0 0 3px var(--card-color, #000), 0 0 5px var(--card-color, #000); }
    .haus i { font-size: 1.8em; color: var(--accent-color); filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6)); }
    .haus span { position: absolute; left: 100%; top: 0.35em; margin-left: 0.3em; white-space: nowrap; }
    .karteninfo { position: absolute; left: 0.5em; right: 0.5em; bottom: 0.5em; display: flex; align-items: center; gap: 0.55em;
                  padding: 0.4em 0.6em; border-radius: 0.5em; font-size: 0.95em; z-index: 5;
                  background: color-mix(in srgb, var(--card-color, #000) 85%, transparent); }
    .karteninfo:empty { display: none; }
    .karteninfo b { white-space: nowrap; }
    .steig small i { margin-right: 0.2em; opacity: 0.85; }
    .steig small.oben { top: auto; bottom: 100%; margin-top: 0; margin-bottom: 0.2em; }
    .karteninfo .text { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .osm { position: absolute; right: 0.35em; top: 0.25em; font-size: 0.6em; opacity: 0.65; z-index: 5; }

    /* ---------- Fuß ---------- */    .stoerung {
        flex: 0 0 auto; display: flex; align-items: center; gap: 0.5em; cursor: pointer;
        font-size: 0.85em; padding: 0.4em 0.55em; border-radius: 0.4em;
        background: color-mix(in srgb, #f59f00 16%, transparent);
    }
    .stoerung i { color: #f59f00; }
    .stoerung span { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stand { flex: 0 0 auto; font-size: 0.8em; opacity: 0.6; text-align: right; font-variant-numeric: tabular-nums; }
    .stand.fehler { color: #e5484d; opacity: 1; }
    .abruf { flex: 0 0 auto; height: 3px; border-radius: 2px; overflow: hidden; margin-top: -0.3em;
             background: color-mix(in srgb, var(--content-color) 10%, transparent); }
    .abruf div { height: 100%; width: 0; background: var(--accent-color); opacity: 0.7; transition: width 1s linear; }

    /* ---------- Detail-Overlay Störungen ---------- */
    .overlay {
        position: fixed; inset: 0; display: none; flex-direction: column; gap: 0.6em;
        padding: var(--margin-top, 10px) var(--margin-side, 12px) var(--margin-bottom, 10px);
        background: var(--card-color, var(--background-color, #222)); overflow-y: auto; z-index: 5;
    }
    .overlay.offen { display: flex; }
    .overlay .zu { align-self: flex-end; cursor: pointer; font-size: 1.2em; opacity: 0.7; }
    .overlay .eintrag { padding-bottom: 0.6em; border-bottom: 1px solid color-mix(in srgb, var(--content-color) 12%, transparent); }
    .overlay .eintrag b { display: block; margin-bottom: 0.2em; }
    .overlay .eintrag .linien { font-size: 0.8em; opacity: 0.7; margin-bottom: 0.3em; }
    .overlay .eintrag p { margin: 0; font-size: 0.85em; white-space: pre-line; opacity: 0.85; }
</style>
</head>
<body>
    <div class="kopf">
        <i class="symbol fa-light fa-sign-hanging" id="kSymbol"></i>
        <div class="titel">
            <div class="name" id="kName">–</div>
            <div class="ort" id="kOrt"></div>
        </div>
        <div class="fuss" id="kFuss"></div>
    </div>
    <div class="inhalt">
        <ul class="liste" id="liste"></ul>
        <div class="karte" id="karte" style="display:none"></div>
    </div>
    <div class="stoerung" id="stoerung" style="display:none"><i class="fa-light fa-triangle-exclamation"></i><span id="stoerungText"></span><i class="fa-light fa-chevron-right" style="color:inherit;opacity:.6"></i></div>
    <div class="stand" id="stand"></div>
    <div class="abruf"><div id="abrufBalken"></div></div>

    <div class="overlay" id="overlay">
        <i class="fa-light fa-xmark zu" id="zu"></i>
        <div id="overlayInhalt"></div>
    </div>

<script>
    const START = /*DATEN*/null;

    const MOT = {
        'Tram': 'fa-train-tram',
        'CityBus': 'fa-bus',
        'IntercityBus': 'fa-bus-simple',
        'SuburbanRailway': 'fa-train-subway',
        'Train': 'fa-train',
        'Ferry': 'fa-ferry',
        'Cableway': 'fa-cable-car',
        'HailedSharedTaxi': 'fa-taxi-bus'
    };
    const AUSLASTUNG = {
        'FewSeats': ['fa-user-group', '', 'wenige Sitzplätze'],
        'StandingOnly': ['fa-users', '', 'nur Stehplätze'],
        'Full': ['fa-users', 'voll', 'voll']
    };

    let daten = START;
    let offset = 0;   // Serverzeit - Browserzeit (ms)

    function el(tag, klasse, text) {
        const e = document.createElement(tag);
        if (klasse) e.className = klasse;
        if (text !== undefined) e.textContent = text;
        return e;
    }
    function icon(klasse) { return el('i', 'fa-light ' + klasse); }
    function uhr(ts) {
        const d = new Date(ts * 1000);
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    function jetzt() { return Date.now() + offset; }
    // Fußweg zum Steig dieser Abfahrt in s (je Steig berechnet, sonst fest)
    function fussweg(a) { return (a && a.f !== undefined && a.f !== null) ? a.f : daten.fussweg * 60; }
    function fwText(s) { return Math.max(1, Math.round(s / 60)) + ' min'; }

    function render() {
        if (!daten) return;
        karte();
        document.getElementById('kName').textContent = daten.name || '–';
        document.getElementById('kOrt').textContent = daten.ort || '';
        const fuss = document.getElementById('kFuss');
        fuss.replaceChildren();
        if (daten.fusswegText) {
            fuss.append(icon('fa-person-walking'), document.createTextNode(daten.fusswegText));
        }

        const liste = document.getElementById('liste');
        liste.replaceChildren();
        const n = jetzt();
        let zeilen = 0;

        if (daten.pause || daten.fehler || !daten.abfahrten || daten.abfahrten.length === 0) {
            const leer = el('li', 'leer');
            if (daten.pause) {
                leer.append(icon('fa-moon'), el('div', '', 'Abfahrtsmonitor pausiert'));
            } else if (daten.fehler && (!daten.abfahrten || daten.abfahrten.length === 0)) {
                leer.append(icon('fa-wifi-slash'), el('div', '', 'Keine Verbindung zur VVO-Auskunft'));
            } else if (!daten.fehler) {
                leer.append(icon('fa-clock'), el('div', '', 'Keine Abfahrten'));
            }
            if (leer.childElementCount) {
                liste.append(leer);
            }
        }

        for (const a of (daten.pause ? [] : (daten.abfahrten || []))) {
            const sek = (a.e * 1000 - n) / 1000;
            if (sek < -30 && !a.a) continue;          // schon weg
            const min = Math.max(0, Math.floor(sek / 60));
            const fw = fussweg(a);
            const unerreichbar = sek < fw;
            if (daten.ausblenden && unerreichbar) continue;
            const losIn = Math.floor((sek - fw) / 60);

            const li = el('li', 'zeile');
            if (a.a) li.classList.add('ausfall');
            else if (unerreichbar && fw > 0) li.classList.add('weg');
            else if (fw > 0 && losIn <= daten.vorlauf) li.classList.add('los');

            const badge = el('span', 'badge m-' + a.m);
            badge.append(icon(MOT[a.m] || 'fa-circle'), document.createTextNode(a.l));
            li.append(badge);

            const ziel = el('div', 'ziel');
            ziel.append(el('div', 'text', a.z));
            let info = [];
            if (a.a) {
                info.push('fällt aus' + (a.ag ? ' – ' + a.ag : ''));
            } else {
                if (a.s) info.push((a.m === 'Train' || a.m === 'SuburbanRailway' ? 'Gleis ' : 'Steig ') + a.s);
                if (a.v) info.push('planm. ' + uhr(a.p));
                if (a.v === null) info.push('ohne Echtzeit');
            }
            ziel.append(el('div', 'info', info.join(' · ')));
            li.append(ziel);

            const chips = el('div', 'chips');
            if (!a.a && a.v > 0) chips.append(el('span', 'spaet', '+' + a.v));
            if (!a.a && a.v < 0) chips.append(el('span', 'frueh', String(a.v)));
            const o = AUSLASTUNG[a.o];
            if (o && !a.a) {
                const s = el('span', o[1]);
                s.title = o[2];
                s.append(icon(o[0]));
                chips.append(s);
            }
            li.append(chips);

            const m = el('div', 'min');
            if (a.a) {
                m.textContent = uhr(a.p);
                m.classList.add('uhr');
            } else if (min >= 60) {
                m.textContent = uhr(a.e);
                m.classList.add('uhr');
            } else if (min === 0) {
                m.textContent = 'jetzt';
                m.classList.add('uhr');
            } else {
                m.textContent = min;
                m.append(el('small', '', 'min'));
            }
            li.append(m);

            liste.append(li);
            zeilen++;
        }
        if (zeilen === 0 && !daten.pause && daten.abfahrten && daten.abfahrten.length > 0 && !liste.childElementCount) {
            const leer = el('li', 'leer');
            leer.append(icon('fa-clock'), el('div', '', 'Gleich neue Abfahrten …'));
            liste.append(leer);
        }

        // nur ganz sichtbare Zeilen zeigen
        const hoehe = liste.clientHeight;
        for (const z of liste.children) {
            if (z.classList.contains('zeile') && z.offsetTop - liste.offsetTop + z.offsetHeight > hoehe + 1) z.style.visibility = 'hidden';
        }

        // Störungen
        const st = daten.stoerungen || [];
        const box = document.getElementById('stoerung');
        if (st.length > 0 && !daten.pause) {
            box.style.display = '';
            document.getElementById('stoerungText').textContent =
                (st.length > 1 ? st.length + ' Meldungen: ' : '') + (st[0].l.length ? 'Linie ' + st[0].l.join(', ') + ' – ' : '') + st[0].t;
        } else {
            box.style.display = 'none';
        }
        const inhalt = document.getElementById('overlayInhalt');
        inhalt.replaceChildren();
        for (const s of st) {
            const e = el('div', 'eintrag');
            e.append(el('b', '', s.t), el('div', 'linien', 'Linie ' + s.l.join(', ')), el('p', '', s.b));
            inhalt.append(e);
        }

        // Stand
        const stand = document.getElementById('stand');
        stand.classList.toggle('fehler', !!daten.fehler);
        if (daten.fehler) {
            stand.textContent = 'Fehler: ' + daten.fehler + (daten.stand ? ' (Daten von ' + uhr(daten.stand) + ')' : '');
        } else {
            abruf();
        }
    }

    // Countdown bis zum nächsten Abruf (Symcon-Timer: Datenstand + Intervall)
    function abruf() {
        const stand = document.getElementById('stand');
        const balken = document.getElementById('abrufBalken');
        if (!daten || daten.fehler) { balken.style.width = '0'; return; }
        if (daten.pause || !daten.stand || !daten.intervall) {
            stand.textContent = daten.stand ? 'Stand ' + uhr(daten.stand) + ' · VVO' : '';
            balken.style.width = '0';
            return;
        }
        const rest = Math.round(daten.stand + daten.intervall - jetzt() / 1000);
        stand.textContent = 'Stand ' + uhr(daten.stand) + ' · ' + (rest > 0 ? 'nächster Abruf in ' + rest + ' s' : 'Abruf läuft …');
        balken.style.width = Math.min(100, Math.max(0, 100 * (1 - rest / daten.intervall))) + '%';
        // eigenständige Seite (IPSView): neue Daten gleich nach dem Abruf holen
        if (rest <= -2 && window.vvoAbruf && Date.now() - (window.vvoLetzt || 0) > 5000) {
            window.vvoLetzt = Date.now();
            window.vvoAbruf();
        }
    }

    // ---------- Karte ----------
    let karteSchluessel = '';

    function weltpixel(lat, lon, z) {
        const n = 256 * Math.pow(2, z);
        const s = Math.sin(lat * Math.PI / 180);
        return [(lon + 180) / 360 * n, (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n];
    }

    // nächste Abfahrt, die nicht ausfällt und noch nicht weg ist;
    // mit Kartenmodus "erreichbar" nur Abfahrten, die man mit dem Fußweg noch schafft
    function naechsteAbfahrt() {
        const n = jetzt();
        const erreichbar = daten.karte && daten.karte.erreichbar;
        for (const a of (daten.abfahrten || [])) {
            if (!a.a && a.e * 1000 - n >= (erreichbar ? fussweg(a) * 1000 : 0)) return a;
        }
        return null;
    }

    function karte() {
        const box = document.getElementById('karte');
        const k = daten && daten.karte;
        if (!k || !k.steige || k.steige.length === 0 || daten.pause) {
            box.style.display = 'none';
            karteSchluessel = '';
            return;
        }
        box.style.display = '';
        const w = box.clientWidth, h = box.clientHeight;
        if (w < 60 || h < 60) return;
        const schluessel = w + 'x' + h + JSON.stringify(k);
        if (schluessel !== karteSchluessel) {
            karteSchluessel = schluessel;
            zeichneKarte(box, k, w, h);
        }
        markiereSteig();
    }

    function zeichneKarte(box, k, w, h) {
        const punkte = k.steige.map(s => [s.lat, s.lon]);
        if (k.haus) punkte.push([k.haus.lat, k.haus.lon]);
        const rahmen = 2.6 * parseFloat(getComputedStyle(box).fontSize);   // Platz für Marker am Rand
        let z = 19, p = [];
        for (; z >= 15; z--) {
            p = punkte.map(q => weltpixel(q[0], q[1], z));
            const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
            if (Math.max(...xs) - Math.min(...xs) <= w - 2 * rahmen && Math.max(...ys) - Math.min(...ys) <= h - 3 * rahmen) break;
        }
        z = Math.max(15, z);
        p = punkte.map(q => weltpixel(q[0], q[1], z));
        const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
        const ox = (Math.max(...xs) + Math.min(...xs)) / 2 - w / 2;
        const oy = (Math.max(...ys) + Math.min(...ys)) / 2 - h / 2 + rahmen * 0.6;   // etwas nach oben, unten liegt die Infozeile

        const ebene = el('div', 'kacheln');
        for (let tx = Math.floor(ox / 256); tx <= Math.floor((ox + w) / 256); tx++) {
            for (let ty = Math.floor(oy / 256); ty <= Math.floor((oy + h) / 256); ty++) {
                const img = document.createElement('img');
                img.alt = '';
                img.src = k.kacheln + z + '/' + tx + '/' + ty;
                img.style.left = Math.round(tx * 256 - ox) + 'px';
                img.style.top = Math.round(ty * 256 - oy) + 'px';
                ebene.append(img);
            }
        }
        const marker = el('div', 'marker');
        for (const s of k.steige) {
            const q = weltpixel(s.lat, s.lon, z);
            const m = el('div', 'steig m-' + ((s.m && s.m[0]) || 'Tram'));
            m.dataset.steig = s.n;
            m.title = 'Steig ' + s.n;
            m.style.left = Math.round(q[0] - ox) + 'px';
            m.style.top = Math.round(q[1] - oy) + 'px';
            m.textContent = s.n;
            if (s.f) {
                m.title += ' · ' + fwText(s.f) + ' Fußweg';
                const fw = el('small');
                fw.append(icon('fa-person-walking'), document.createTextNode(fwText(s.f)));
                m.append(fw);
            }
            marker.append(m);
        }
        if (k.haus) {
            const q = weltpixel(k.haus.lat, k.haus.lon, z);
            const m = el('div', 'haus');
            m.style.left = Math.round(q[0] - ox) + 'px';
            m.style.top = Math.round(q[1] - oy) + 'px';
            if (k.haus.text) m.append(el('span', '', k.haus.text));
            m.append(icon('fa-location-dot'));
            marker.append(m);
        }
        const info = el('div', 'karteninfo');
        info.id = 'karteInfo';

        // Kartenbild an das Farbschema anpassen (helle Schrift = dunkles Theme)
        const c = (getComputedStyle(document.body).color.match(/\d+/g) || [0, 0, 0]).map(Number);
        const dunkel = 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2] > 128;
        box.classList.toggle('dunkel', dunkel);
        box.classList.toggle('hell', !dunkel);
        box.replaceChildren(ebene, marker, info, el('div', 'osm', '© OpenStreetMap'));

        // Fußweg-Beschriftungen, die einen anderen Marker überdecken, über den eigenen Marker setzen
        const steige = [...marker.querySelectorAll('.steig')];
        const ueber = (a, b) => a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
        for (const m of steige) {
            const t = m.querySelector('small');
            if (!t) continue;
            const r = t.getBoundingClientRect();
            if (steige.some(o => o !== m && ueber(r, o.getBoundingClientRect()))) t.classList.add('oben');
        }
    }

    function markiereSteig() {
        const a = naechsteAbfahrt();
        let min = 0, eilig = false;
        if (a) {
            min = Math.max(0, Math.floor((a.e * 1000 - jetzt()) / 60000));
            const rest = (a.e * 1000 - jetzt()) / 1000 - fussweg(a);
            eilig = fussweg(a) > 0 && Math.floor(rest / 60) <= daten.vorlauf;
        }
        document.querySelectorAll('#karte .steig').forEach(m => {
            const an = !!a && a.s !== '' && m.dataset.steig === a.s;
            m.classList.toggle('blink', an);
            m.classList.toggle('eilig', an && eilig);
        });
        const info = document.getElementById('karteInfo');
        if (!info) return;
        if (!a) {
            info.replaceChildren();
            return;
        }
        const b = el('span', 'badge m-' + a.m);
        b.append(icon(MOT[a.m] || 'fa-circle'), document.createTextNode(a.l));
        const knapp = fussweg(a) > 0 && (a.e * 1000 - jetzt()) < fussweg(a) * 1000;
        const t = el('span', 'text', a.z + (a.s ? ' · Steig ' + a.s : '') + (knapp ? ' · kaum zu schaffen' : ''));
        const z = el('b', '', min === 0 ? 'jetzt' : min + ' min');
        info.replaceChildren(b, t, z);
    }

    window.addEventListener('resize', () => karte());

    function handleMessage(nachricht) {        try { daten = typeof nachricht === 'string' ? JSON.parse(nachricht) : nachricht; } catch (e) { return; }
        if (daten && daten.jetzt) offset = daten.jetzt * 1000 - Date.now();
        render();
    }

    document.getElementById('stoerung').addEventListener('click', () => document.getElementById('overlay').classList.add('offen'));
    document.getElementById('zu').addEventListener('click', () => document.getElementById('overlay').classList.remove('offen'));

    if (START) handleMessage(START);
    setInterval(render, 10000);
    setInterval(abruf, 1000);
</script>
</body>
